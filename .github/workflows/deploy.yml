name: Deploy CYOA Story Demo

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Environment Variables
        run: |
          sed -e "s|{{GA_MEASUREMENT_ID}}|${{ secrets.GA_MEASUREMENT_ID }}|g" \
              -e "s|{{GISCUS_REPO}}|${{ secrets.GISCUS_REPO }}|g" \
              -e "s|{{GISCUS_REPO_ID}}|${{ secrets.GISCUS_REPO_ID }}|g" \
              -e "s|{{GISCUS_CATEGORY_ID}}|${{ secrets.GISCUS_CATEGORY_ID }}|g" \
              src/config.js.template > src/config.js

      - name: Install Tweego and Story Formats
        run: |
          wget https://github.com/tmedwards/tweego/releases/download/v2.1.1/tweego-2.1.1-linux-x64.zip
          unzip tweego-2.1.1-linux-x64.zip -d tweego_bin
          chmod +x tweego_bin/tweego
          mkdir -p ~/.local/share/Tweego/storyformats
          wget -O sugarcube-2.zip https://github.com/tmedwards/sugarcube-2/releases/download/v2.36.1/sugarcube-2.36.1-for-twine-2.1-local.zip
          unzip sugarcube-2.zip -d ~/.local/share/Tweego/storyformats/sugarcube-2

      - name: Compile Markdown to HTML
        run: |
          # Tweego는 .md를 무시하므로 .twee 빌드용 복사본 생성
          for f in src/*.md; do cp "$f" "${f%.md}.twee"; done
          ./tweego_bin/tweego --log-files --log-stats -o index.html --format=sugarcube-2 src/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Site Artifact
        run: |
          mkdir -p site
          cp index.html site/
          ls -lh site/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
